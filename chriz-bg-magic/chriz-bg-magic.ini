; Chriz BG Magic - Configuration File
; Place your customized copy in the game folder (chriz-bg-magic.ini, next to chitin.key)
; so mod updates never overwrite your choices, or edit chriz-bg-magic/chriz-bg-magic.ini.
; Re-run setup-chriz-bg-magic after changing values.
; Visual configurator: https://bg.chrizfader.org/magic
;
; Tier 1: Pure bug fixes, saving-throw alignment, monster immunity normalization, spellbook consistency, and scroll synchronization are always installed (Tier 1). Only opt-out system rules, added spells, balance reworks, and numeric knobs appear below.

[systems]
; Core Systems - Mod-wide stacking, summon, clone, and UI rules. Set any option to 0 to disable it.
; Typed Spell Bonuses [requires EEex]: Enforce non-stacking bonus types (Morale, Favor, Luck, Dodge, Deflection, Curse); highest bonus per type applies. (0 = off, 1 = on; default = 1)
typed_bonuses = 1

; +1 Extra Attack Cap [requires EEex]: Cap magic extra-attack buffs (Haste, Improved Haste, Righteous Wrath of the Faithful) to at most +1 attack per round total. (0 = off, 1 = on; default = 1)
extra_attack_cap = 1

; Exclusive Transformation & Regeneration Families: Prevent self-transformations from stacking, pair Champion's Strength with Draw Upon Holy Might, and keep Regeneration mutually exclusive. (0 = off, 1 = on; default = 1)
exclusive_families = 1

; Strength Floors (Never Lower Strength) [requires EEex]: Turn Strength (18/50), Strength of One (18/75), Divine Power (18/00), and Champion's Strength (21) into minimum floors (with EEex; fallback without EEex). (0 = off, 1 = on; default = 1)
strength_floors = 1

; Lesser Restoration Without Fatigue [requires EEex]: Lesser Restoration removes level drain and feeblemind without applying fatigue. (0 = off, 1 = on; default = 1)
lesser_restoration_no_fatigue = 1

; Simulacrum & Project Image Clone Rules [requires EEex]: Normalize Simulacrum and Project Image clones (60% HP/level scaling, no nested clones, contingencies, Wish, or duplicate quick items). (0 = off, 1 = on; default = 1)
simulacrum_clone_rules = 1

; Main Character Statue & Imprisonment Continuation [requires EEex]: Let companions keep fighting when Player 1 is Petrified or Imprisoned, ending in defeat only when no party member can rescue them. (0 = off, 1 = on; default = 1)
player1_protection = 1

; Live Character Record Status Icons [requires EEex]: Show live active status icons in the Character Record panel while paused or playing. (0 = off, 1 = on; default = 1)
live_record_icons = 1

[new_spells]
; New Divine Spells - Six Icewind Dale and classic D&D divine spells added to cleric/druid spellbooks. Set any entry to 0 to omit it.
; Faerie Fire (Level 1 Druid): Add 1st-level druid spell Faerie Fire (-2 AC, reveals invisibility, blocks stealth). (0 = off, 1 = on; default = 1)
new_faerie_fire = 1

; Icelance (Level 3 Druid): Add 3rd-level druid/cleric cold bolt Icelance (or normalize existing IWD Icelance). (0 = off, 1 = on; default = 1)
new_icelance = 1

; Protection from Cold (Level 3 Divine): Add 3rd-level divine Protection from Cold (100% cold resistance for 1 turn/level). (0 = off, 1 = on; default = 1)
new_protection_from_cold = 1

; Protection from Acid (Level 4 Divine): Add 4th-level divine Protection from Acid (100% acid resistance for 1 turn/level). (0 = off, 1 = on; default = 1)
new_protection_from_acid = 1

; Mass Regenerate (Level 5 Divine): Add 5th-level divine Mass Regenerate (party-wide 2 HP/second for 1 round/level). (0 = off, 1 = on; default = 1)
new_mass_regenerate = 1

; Conjure Air Elemental (Level 6 Druid): Add 6th-level druid Conjure Air Elemental with three caster-level scaling tiers. (0 = off, 1 = on; default = 1)
new_conjure_air_elemental = 1

[reworks]
; Spell Balance Reworks - Individual spell and spell-group balance reworks. Set any toggle to 0 to keep that spell group vanilla.
; Faster Divine Healing & Cause Wounds: Give Cure spells 10 ft. reach, speed up Cure/Cause casting times (Cure Light 1 through Heal/Harm 6), and unify Mass Cure/Heal delivery. (0 = off, 1 = on; default = 1)
rework_divine_healing = 1

; Fast Doom (Casting Time 1, Curse Penalties): Lower Doom's casting time from 9 to 1 and focus its debuff on THAC0, damage, and saves as a Curse. (0 = off, 1 = on; default = 1)
rework_doom = 1

; Party Improved Haste: Rework Improved Haste from single-target doubled attacks into a 15-ft. party buff lasting 3 rounds + 1 round/level. (0 = off, 1 = on; default = 1)
rework_improved_haste = 1

; Dispelling Screen (Breach -> AoE Dispel Protection): Convert Breach into party-wide 15-ft. Dispelling Screen that intercepts one Remove/Dispel Magic. (0 = off, 1 = on; default = 1)
rework_dispelling_screen = 1

; Halving Pierce Magic (10%-40% MR Reduction) [requires EEex]: Halve the target's current Magic Resistance (clamped to 10%-40% for 5 rounds) alongside dispelling one spell protection. (0 = off, 1 = on; default = 1)
rework_pierce_magic = 1

; Skull Trap Damage Cap (12d6): Cap Skull Trap scaling at 12d6 maximum damage. (0 = off, 1 = on; default = 1)
rework_skull_trap = 1

; Scaling Chromatic Orb: Remove Conjurer school lock and rebalance Chromatic Orb's level-scaled damage and secondary effects (no instant-kill orb). (0 = off, 1 = on; default = 1)
rework_chromatic_orb = 1

; Death Spell vs. Insect Swarms & Summons: Allow Death Spell to disperse Summon Insects, Insect Plague, Creeping Doom, and Vampire Cloud of Bats while sparing immune celestials. (0 = off, 1 = on; default = 1)
rework_death_spell = 1

; Scaling Find Familiar: Scale familiar HP smoothly by caster level, match familiar-granting scrolls, and prevent extreme familiar HP outliers. (0 = off, 1 = on; default = 1)
rework_find_familiar = 1

; Honest Mirror & Reflected Image: Mirror Image no longer blocks area-of-effect spells; Reflected Image grants a single non-stacking decoy image. (0 = off, 1 = on; default = 1)
rework_mirror_image = 1

; Wake on Damage (Sleep, Color Spray, PW: Sleep, Hopelessness): Damage immediately wakes targets of Sleep, Color Spray, Power Word Sleep, and Emotion/Symbol Hopelessness. (0 = off, 1 = on; default = 1)
rework_wake_on_damage = 1

; Rebuilt Polymorph Self & Shapechange Forms: Deliver 7 rebuilt forms each with explicit stats, weapons, abilities, and clean reversion without bogus stat overrides. (0 = off, 1 = on; default = 1)
rework_polymorph_shapechange = 1

; Reworked Cacofiend, Summon Fiend & Gate: Fix fiend AI/allegiance scripts and balance Nabassu, Glabrezu, Cornugon, and Balor summons across arcane and divine Gate. (0 = off, 1 = on; default = 1)
rework_gate_fiends = 1

; Reworked Devas & Planetars: Rebalance Devas (3 turns, 14 HD) and Planetars (2 turns, 18 HD, no permanent Haste) with full spellbook control and death-magic immunity. (0 = off, 1 = on; default = 1)
rework_celestials = 1

; 1 Deva + 1 Planetar Party Cap: Limit party-side celestial summons to at most one (Fallen) Deva and one (Dark) Planetar at a time. (0 = off, 1 = on; default = 1)
celestial_party_cap = 1

[tuning]
; Numeric Balance Tuning - Direct integer parameters applied during installation (Tier 3). Out-of-range values clamp to safe bounds.
; Cure Spells Range: Range in feet for single-target Cure Wounds spells (Light through Critical, plus their scrolls). (2..30 ft.; default = 10)
cure_range_feet = 10

; Cure Light Wounds Casting Time: Casting time (1-9) for Cure Light Wounds. (1..9 speed; default = 1)
cure_light_ct = 1

; Cure Moderate Wounds Casting Time: Casting time (1-9) for IWD Cure Moderate Wounds when present. (1..9 speed; default = 2)
cure_moderate_ct = 2

; Cure Medium Wounds Casting Time: Casting time (1-9) for Cure Medium Wounds. (1..9 speed; default = 3)
cure_medium_ct = 3

; Cure Serious Wounds Casting Time: Casting time (1-9) for Cure Serious Wounds. (1..9 speed; default = 4)
cure_serious_ct = 4

; Cure Critical Wounds Casting Time: Casting time (1-9) for Cure Critical Wounds. (1..9 speed; default = 5)
cure_critical_ct = 5

; Mass Cure Casting Time: Casting time (1-9) for Mass Cure. (1..9 speed; default = 4)
mass_cure_ct = 4

; Heal Casting Time: Casting time (1-9) for Heal. (1..9 speed; default = 6)
heal_ct = 6

; Cause Moderate Wounds Casting Time: Casting time (1-9) for IWD Cause Moderate Wounds when present. (1..9 speed; default = 2)
cause_moderate_ct = 2

; Cause Medium Wounds Casting Time: Casting time (1-9) for IWD Cause Medium Wounds when present. (1..9 speed; default = 3)
cause_medium_ct = 3

; Cause Serious Wounds Casting Time: Casting time (1-9) for Cause Serious Wounds (plus IWD variant). (1..9 speed; default = 4)
cause_serious_ct = 4

; Cause Critical Wounds Casting Time: Casting time (1-9) for Cause Critical Wounds (plus IWD variant). (1..9 speed; default = 5)
cause_critical_ct = 5

; Harm Casting Time: Casting time (1-9) for Harm. (1..9 speed; default = 6)
harm_ct = 6

; Doom Casting Time: Casting time (1-9) for Doom. (1..9 speed; default = 1)
doom_ct = 1

; Improved Haste Casting Time: Casting time (1-9) for Party Improved Haste. (1..9 speed; default = 6)
improved_haste_ct = 6

; Improved Haste Base Rounds (+1 round/level): Base duration rounds before adding 1 round per caster level (set 0 for pure 1 round/level). (0..20 rounds; default = 3)
improved_haste_base_rounds = 3

; Dispelling Screen Duration: Protection duration in turns (1 turn = 10 rounds / 60 seconds). (1..20 turns; default = 5)
dispelling_screen_turns = 5

; Pierce Magic Minimum MR Reduction [requires EEex]: Minimum percentage points removed when halving target Magic Resistance. (0..100 %; default = 10)
pierce_magic_mr_min = 10

; Pierce Magic Maximum MR Reduction [requires EEex]: Maximum percentage points removed when halving target Magic Resistance (at least pierce_magic_mr_min). (0..100 %; default = 40)
pierce_magic_mr_max = 40

; Pierce Magic MR Reduction Duration [requires EEex]: Duration of the Magic Resistance penalty in rounds. (1..20 rounds; default = 5)
pierce_magic_rounds = 5

; Skull Trap Max Scaling Dice: Maximum caster-level scaling dice (Nd6) for Skull Trap. (5..30 d6; default = 12)
skull_trap_max_dice = 12

; Deva & Planetar Casting Time: Casting time (1-9) across all Summon (Fallen) Deva and Summon (Dark) Planetar spells. (1..9 speed; default = 9)
celestial_ct = 9

; Deva Summon Duration: Summon duration in turns for Summon Deva and Summon Fallen Deva (including HLAs). (1..20 turns; default = 3)
deva_duration_turns = 3

; Planetar Summon Duration: Summon duration in turns for Summon Planetar and Summon Dark Planetar. (1..20 turns; default = 2)
planetar_duration_turns = 2
