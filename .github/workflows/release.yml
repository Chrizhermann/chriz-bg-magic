name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package (without leading v)'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install pillow lupa

      - name: Download WeiDU 249.00
        shell: pwsh
        run: |
          $url = "https://github.com/WeiDUorg/weidu/releases/download/v249.00/WeiDU-Windows-249-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\weidu.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\weidu.zip" -DestinationPath "$env:RUNNER_TEMP\weidu" -Force
          $exe = Get-ChildItem -Path "$env:RUNNER_TEMP\weidu" -Filter "weidu.exe" -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exe) { throw "weidu.exe not found in archive" }
          "WEIDU_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Exclude workspace and temp from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:TEMP -ExclusionProcess "$env:WEIDU_EXE" -ErrorAction SilentlyContinue

      - name: Rebuild and verify resources
        run: python tools/build_resources.py

      - name: Run full test suite
        run: python tests/run_tests.py --weidu "$env:WEIDU_EXE"

      - name: Build release archive
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { "${{ github.event.inputs.version }}" } else { $env:GITHUB_REF_NAME }
          python tools/build_release.py --version $ver --weidu "$env:WEIDU_EXE" --out-dir dist

      - name: Publish release if not already created
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist\* | Select-Object -ExpandProperty FullName
          gh release view "$env:GITHUB_REF_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" @files --title "Chriz BG Magic $env:GITHUB_REF_NAME" --generate-notes
          } else {
            Write-Host "Release $env:GITHUB_REF_NAME already exists; skipping asset overwrite."
          }
